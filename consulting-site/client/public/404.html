<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>松田聡一 | AI・深層学習 技術・経営アドバイザー</title>
    <script>
        // GitHub Pages SPA用のリダイレクト処理
        // パスを取得してindex.htmlにリダイレクト
        const path = window.location.pathname.replace('/soichimatsuda', '');
        const search = window.location.search;
        const hash = window.location.hash;
        
        // ベースパスを含むURLに変更
        window.location.replace('/soichimatsuda/' + (path === '/' ? '' : path.slice(1)) + search + hash);
    </script>
</head>
<body>
    <p>リダイレクト中...</p>
</body>
</html>
